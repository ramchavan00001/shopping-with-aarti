# Render Blueprint: one Node web service. The database is hosted on Neon
# (https://neon.tech): paste its connection string as DATABASE_URL.
# Dashboard → New → Blueprint → pick this repo; Render asks for the values
# marked `sync: false`.
#
# A free web service sleeps after 15 idle minutes (~1 minute to wake).
# Switch `plan` to a paid instance before going live.

services:
  - type: web
    name: shopping-with-aarti
    runtime: node
    plan: free
    region: singapore # keep in the same region as the Neon database
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon connection string (Neon console → Connect).
      - key: DATABASE_URL
        sync: false
      # Password for /admin. Use a long, unique one.
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # First boot fills an empty database with the demo catalogue. Set to
      # "false" before the first deploy to start empty instead.
      - key: SEED_DEMO
        value: "true"
      # Optional: Cloudflare R2 for uploading videos/photos from /admin.
      - key: MEDIA_BASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Optional: also forward brand enquiries to a webhook.
      - key: ENQUIRY_WEBHOOK_URL
        sync: false
